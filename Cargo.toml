[package]
name = "mu-console-theme"
version = "0.1.1"
edition = "2021"
authors = ["LMA1980"]
repository = "https://github.com/LMA1980/mu-console-theme"
description = "MuConsole theme suite: skin-agnostic ConsoleScene/DialogModel descriptors, HtmlCoreSkin, WireframeSkin, CSS/SVG tokens, Nerd icons, and font metrics"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[lib]
name = "mu_console_theme"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
roxmltree = "0.20"

[[bin]]
name = "mu-console-subset-unicodes"
path = "src/bin/subset_unicodes.rs"

[[bin]]
name = "mu-console-tokens-css"
path = "src/bin/tokens_css.rs"
